<!DOCTYPE html>
<html>
<head>
    <title>Alert Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Notification Portal</h1>
    <p>Click below to enable notifications.</p>

    <button onclick="requestPermission()">
        Enable Notifications
    </button>

    <script>
        function requestPermission() {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("Notifications Enabled");
                } else {
                    alert("Notifications Denied");
                }
            });
        }
    </script>
</body>
<div class="floating-heart"
style="left:10%">
❤️
</div>

<div class="floating-heart"
style="left:40%">
💖
</div>

<div class="floating-heart"
style="left:70%">
💕
</div>
</html>
